<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biberabend</title>

<style>
:root{
  color-scheme:dark;
  font-family:system-ui,sans-serif;
  color:#effbf6;
  background:#091d24;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100dvh;
  background:
    linear-gradient(#071b2466,#071b24cc),
    url("/biber.png") center/cover fixed;
}
button,input{font:inherit}
button{
  cursor:pointer;border:0;border-radius:12px;
  padding:12px 17px;background:#83efd0;
  color:#103331;font-weight:750;
  transition:filter .15s,box-shadow .15s;
}
button:hover:not(:disabled){filter:brightness(1.12)}
button:disabled{opacity:.4;cursor:default}
button.secondary{background:#294c55;color:#e2f5f1}
button.gold{background:#ffd68c;color:#4f3413}
button:focus-visible,input:focus-visible{
  outline:3px solid #ffda91;outline-offset:3px;
}
input{
  width:100%;background:#0d2932;border:1px solid #426069;
  border-radius:12px;padding:14px;color:white;
  margin:7px 0 16px;
}
label{display:block;color:#cae4df;font-size:14px}
header{
  max-width:1100px;margin:auto;padding:18px;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;
}
.brand{font-size:24px;font-weight:850;letter-spacing:-1px}
.sub{color:#b4cec7;font-size:13px}
.header-right{display:flex;align-items:center;gap:12px}
#sound{font-size:14px;padding:10px 12px}
main{max-width:1060px;margin:auto;padding:0 16px 30px}
.glass{
  background:#0c2933eb;border:1px solid #416064;
  border-radius:22px;box-shadow:0 15px 60px #00141a50;
}
.welcome{max-width:470px;margin:6vh auto;padding:30px}
h1{font-size:38px;letter-spacing:-1.5px;line-height:1.1;margin:12px 0}
p{color:#bdd5d0;line-height:1.6}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.divider{border-top:1px solid #35515a;margin:24px 0}
.badge{
  font-size:12px;letter-spacing:2px;text-transform:uppercase;
  color:#8aeace;
}
.code{
  font-size:38px;font-weight:850;letter-spacing:7px;
  color:#ffd68c;margin:10px 0;
}
.lobby{max-width:600px;margin:4vh auto;padding:28px}
.member{
  display:flex;justify-content:space-between;gap:12px;
  padding:13px 0;border-bottom:1px solid #31505a;
}
.status{
  padding:14px 18px;margin-bottom:12px;display:flex;
  align-items:center;justify-content:space-between;gap:12px;
}
.status strong{display:block;font-size:18px}
.status span{font-size:14px;color:#c1d9d4}
.opponents{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));
  gap:12px;
}
.player{
  padding:12px;border:1px solid #3d5c65;border-radius:18px;
  background:#102d36ec;transition:box-shadow .3s,border-color .3s;
  min-width:0;
}
.player.active{
  border-color:#9effdd;
  box-shadow:0 0 25px #60efb338,inset 0 0 20px #60efb309;
}
.player.mine{max-width:570px;margin:12px auto}
.player-head{
  display:flex;justify-content:space-between;font-size:14px;
  gap:8px;margin-bottom:10px;flex-wrap:wrap;
}
.player-head strong{overflow-wrap:anywhere}
.hand-row{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1fr);
  gap:7px;align-items:start;
}
.held-slot{margin-left:5px;min-width:0}
.held-label{
  font-size:11px;text-align:center;color:#b7d5cb;
  margin-top:5px;
}
.card{
  position:relative;display:block;width:100%;padding:0;
  aspect-ratio:2/3;min-width:0;overflow:hidden;
  border-radius:10px;border:2px solid #88b1a4;
  background:linear-gradient(145deg,#245851,#103632);
  box-shadow:0 4px 0 #041c23,0 6px 13px #0003;
  color:#fff5d4;
}
.card:disabled{opacity:1}
.card.open{border-color:#e9d596}
.card.action{
  border-color:#a5c9ff;
  background:linear-gradient(140deg,#294e74,#142d47);
}
.card.selected{
  outline:3px solid #ffda91;outline-offset:2px;
  box-shadow:0 0 22px #ffc95d80;
}
.card.selectable:hover{box-shadow:0 0 18px #a5ffe18c}
.art{
  position:absolute;left:0;width:100%;aspect-ratio:1;
  top:50%;transform:translateY(-50%);
  background-image:url("/karten.png");
  background-size:400% 400%;background-repeat:no-repeat;
  pointer-events:none;
}
.value{
  position:absolute;top:4px;left:6px;z-index:1;
  font-size:clamp(20px,3.4vw,35px);font-weight:900;
  line-height:1.1;color:#ffecad;
  text-shadow:0 2px 3px #082328,0 0 8px #071b24;
}
.action .value{color:#d8e8ff}
.card-title{
  position:absolute;left:0;right:0;bottom:5px;
  text-align:center;font-size:11px;font-weight:850;
  letter-spacing:.5px;text-shadow:0 2px 5px #000;
}
.position{
  position:absolute;top:5px;right:6px;font-size:11px;
  color:#d6e9de;text-shadow:0 1px 4px #000;
}
.ghost{
  width:100%;aspect-ratio:2/3;border:1px dashed #55736c;
  border-radius:10px;background:#08272c66;
  display:grid;place-items:center;color:#78988b;font-size:20px;
}
.table{
  padding:15px;margin:12px 0;text-align:center;
  background:#143c42ed;border:1px solid #4c7271;border-radius:22px;
}
.table-middle{
  display:flex;align-items:center;justify-content:center;
  gap:25px;flex-wrap:wrap;
}
.piles{display:flex;justify-content:center;gap:16px;align-items:start}
.pile{width:75px}
.pile p{font-size:12px;margin:7px 0 0}
.action-area{max-width:510px;flex:1;min-width:210px}
.instruction{color:#effff5;font-size:16px;line-height:1.5;margin:8px 0 12px}
.controls{justify-content:center;gap:8px}
.note{font-size:13px;color:#b9d6cd;margin:12px 0 0}
.eventline{color:#ffd995;min-height:21px;font-size:14px}
.result{padding:16px;margin:12px 0}
.result-row{
  display:flex;justify-content:space-between;gap:12px;
  padding:10px;border-bottom:1px solid #35545d;flex-wrap:wrap;
}
.flight{
  position:fixed;z-index:1000;pointer-events:none;
  perspective:800px;
}
.flight .card{width:100%;height:100%;box-shadow:0 14px 28px #0008}
#notice{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  z-index:2000;max-width:92vw;width:max-content;
  background:#f5d292;color:#402c18;padding:12px 18px;
  border-radius:12px;box-shadow:0 8px 30px #0008;display:none;
}
details{
  max-width:730px;margin:20px auto;color:#bad4cf;
  font-size:14px;line-height:1.6;
}
summary{cursor:pointer;color:#d9eee8}
@media(max-width:600px){
  header{padding:12px 16px}
  .brand{font-size:21px}
  .header-right{gap:7px}
  #connection{font-size:12px;max-width:130px}
  main{padding:0 10px 25px}
  .welcome{margin:3vh auto;padding:22px}
  h1{font-size:32px}
  .opponents{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .player{padding:9px}
  .player-head{font-size:12px;gap:3px;margin-bottom:7px}
  .hand-row{gap:4px}
  .held-slot{margin-left:2px}
  .opponents .card{border-radius:5px;border-width:1px}
  .opponents .value{font-size:17px;left:3px;top:2px}
  .opponents .position,.opponents .card-title{display:none}
  .opponents .held-label{font-size:10px;margin-top:3px}
  .player.mine{max-width:440px}
  .mine .card{max-height:135px}
  .status{padding:11px 13px}
  .status strong{font-size:16px}
  .status span{font-size:12px}
  .table{padding:12px}
  .table-middle{gap:12px}
  .pile{width:60px}
  .action-area{min-width:150px}
  .instruction{font-size:14px}
  .controls button{font-size:14px;padding:10px 12px}
  .code{font-size:30px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important}
}
  /* Vier eigene Karten; gezogene Karte liegt zentral. */
.hand-row {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.table-middle {
  flex-direction: column;
  gap: 12px;
}

.action-area {
  width: 100%;
  max-width: 650px;
}

.piles {
  gap: 28px;
  align-items: flex-start;
}

.pile {
  width: 90px;
}

.drawn-pile {
  width: 105px;
}

.drawn-pile .card,
.drawn-pile .ghost {
  border: 2px solid #ffda91;
  box-shadow: 0 0 25px #ffd68c30;
}

.drawn-pile p {
  color: #ffe2aa;
}

.flight .card {
  border-color: #ffe3a2;
  box-shadow:
    0 18px 40px #000a,
    0 0 22px #ffd68c66;
}

@media (max-width: 600px) {
  .piles {
    gap: 18px;
  }

  .pile {
    width: 70px;
  }

  .drawn-pile {
    width: 82px;
  }
}
</style>
</head>

<body>
<header>
  <div class="brand">🦫 Biberabend</div>
  <div class="header-right">
    <span id="connection" class="sub">2–6 Personen</span>
    <button id="sound" class="secondary" type="button">Ton an</button>
  </div>
</header>

<main id="app"></main>
<div id="notice" role="status" aria-live="polite"></div>

<script>
"use strict";

const app = document.getElementById("app");
const connection = document.getElementById("connection");
const soundButton = document.getElementById("sound");
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

let credentials = null;
let state = null;
let received = 0;
let queue = [];
let processing = false;
let busy = false;
let polling = false;
let epoch = 0;
let selection = null;
let caption = "";
let noticeTimer;
const animations = new Set();

try {
  credentials = JSON.parse(sessionStorage.getItem("biber-session"));
} catch {}

function escapeText(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  }[character]));
}

function notify(message) {
  const box = document.getElementById("notice");
  box.textContent = message;
  box.style.display = "block";
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => box.style.display = "none", 5000);
}

function remember() {
  try {
    if (credentials) {
      sessionStorage.setItem("biber-session", JSON.stringify(credentials));
    } else {
      sessionStorage.removeItem("biber-session");
    }
  } catch {}
}

/* Sounds werden im Browser erzeugt. */
let audio = null;
let soundEnabled = true;

try {
  soundEnabled = localStorage.getItem("biber-ton") !== "aus";
} catch {}

function updateSoundButton() {
  soundButton.textContent = soundEnabled ? "🔊 Ton an" : "🔇 Ton aus";
  soundButton.setAttribute("aria-pressed", String(soundEnabled));
}

function unlockAudio() {
  if (!soundEnabled) return;
  try {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;
    if (!audio) audio = new Audio();
    if (audio.state === "suspended") audio.resume().catch(() => {});
  } catch {}
}

document.addEventListener("pointerdown", unlockAudio, {passive:true});
document.addEventListener("keydown", unlockAudio);

soundButton.onclick = () => {
  soundEnabled = !soundEnabled;
  try {
    localStorage.setItem("biber-ton", soundEnabled ? "an" : "aus");
  } catch {}
  unlockAudio();
  updateSoundButton();
};

function tone(at, frequency, endFrequency, duration, volume) {
  const oscillator = audio.createOscillator();
  const gain = audio.createGain();

  oscillator.type = "triangle";
  oscillator.frequency.setValueAtTime(frequency, at);
  oscillator.frequency.exponentialRampToValueAtTime(endFrequency, at + duration);

  gain.gain.setValueAtTime(0.001, at);
  gain.gain.exponentialRampToValueAtTime(volume, at + .008);
  gain.gain.exponentialRampToValueAtTime(.001, at + duration);

  oscillator.connect(gain);
  gain.connect(audio.destination);
  oscillator.start(at);
  oscillator.stop(at + duration + .02);
}

function swish(at) {
  const duration = .17;
  const buffer = audio.createBuffer(
    1, Math.ceil(audio.sampleRate * duration), audio.sampleRate
  );
  const samples = buffer.getChannelData(0);

  for (let i = 0; i < samples.length; i++) {
    samples[i] = Math.random() * 2 - 1;
  }

  const source = audio.createBufferSource();
  const filter = audio.createBiquadFilter();
  const gain = audio.createGain();

  source.buffer = buffer;
  filter.type = "bandpass";
  filter.frequency.setValueAtTime(1800, at);
  filter.frequency.exponentialRampToValueAtTime(500, at + duration);
  filter.Q.value = .7;

  gain.gain.setValueAtTime(.001, at);
  gain.gain.linearRampToValueAtTime(.1, at + .035);
  gain.gain.exponentialRampToValueAtTime(.001, at + duration);

  source.connect(filter);
  filter.connect(gain);
  gain.connect(audio.destination);
  source.start(at);
}

function playSound(type) {
  if (!soundEnabled || !audio || audio.state !== "running") return;

  try {
    const t = audio.currentTime + .015;

    if (type === "knock") {
      for (let i = 0; i < 3; i++) {
        tone(t + i * .16, 180, 55, .11, .25);
      }
    } else if (type === "score") {
      [392, 494, 587, 784].forEach((f,i) => {
        tone(t + i * .1, f, f, .25, .09);
      });
    } else if (type === "swap") {
      swish(t);
      swish(t + .16);
      tone(t + .36, 130, 65, .08, .1);
    } else if (type === "deal") {
      for (let i = 0; i < 4; i++) swish(t + i * .08);
    } else if (["draw","take","peek","close","ready"].includes(type)) {
      swish(t);
    } else if (["replace","discard","second","use"].includes(type)) {
      swish(t);
      tone(t + .22, 160, 60, .1, .15);
    }
  } catch {}
}

updateSoundButton();

/* Verbindung */
async function post(path, data) {
  const response = await fetch("/api/" + path, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(data),
    signal:AbortSignal.timeout(15000)
  });

  const result = await response.json();

  if (!response.ok) {
    const error = new Error(result.error || "Anfrage fehlgeschlagen.");
    error.status = response.status;
    throw error;
  }

  return result;
}

function locked() {
  return busy || processing || queue.length > 0;
}

/* Kartenmotive: 4 × 4 Felder in karten.png */
function motif(value) {
  if (typeof value === "number") return value;
  if (value === "Spähen") return 10;
  if (value === "Tausch") return 11;
  if (value === "Zweimal") return 12;
  return 13;
}

function card(value, zone = "", enabled = false, selected = false) {
  const tile = motif(value);
  const column = tile % 4;
  const row = Math.floor(tile / 4);
  const special = typeof value === "string";
  const open = value !== null && value !== undefined;

  const numberOrIcon = !open ? "" :
    typeof value === "number" ? value :
    value === "Spähen" ? "◉" :
    value === "Tausch" ? "⇄" : "2×";

  const title = !open ? "BIBERABEND" :
    special ? (value === "Zweimal" ? "2× ZIEHEN" : value.toUpperCase()) :
    value >= 6 ? "RATTE" : "BIBER";

  const position = zone.startsWith("hand:")
    ? Number(zone.split(":")[2]) + 1 : "";

  return `
    <button type="button"
      class="card ${open ? "open" : ""} ${special ? "action" : ""}
        ${selected ? "selected" : ""} ${enabled ? "selectable" : ""}"
      ${zone ? `data-zone="${zone}"` : ""}
      ${enabled && !locked() ? "" : "disabled"}
      aria-label="${position ? "Karte " + position + ": " : ""}${escapeText(open ? value : "verdeckt")}">
      <span class="art" style="background-position:${column * 100/3}% ${row * 100/3}%"></span>
      <span class="value">${numberOrIcon}</span>
      <span class="position">${position}</span>
      <span class="card-title">${escapeText(title)}</span>
    </button>
  `;
}

function playerHTML(person, index) {
  const s = state;
  const mine = index === s.me;
  const turn = s.phase === "play" && index === s.turn;
  const myTurn = s.phase === "play" && s.turn === s.me;

  const cards = person.hand.map((value, cardIndex) => {
    const ownAction = mine && (
      (s.step === "held" && typeof s.held === "number") ||
      s.step === "peek" ||
      s.step === "swap"
    );

    const otherAction =
      !mine && s.step === "swap" && selection !== null;

    return card(
      value,
      `hand:${index}:${cardIndex}`,
      myTurn && (ownAction || otherAction),
      mine && selection === cardIndex && s.step === "swap"
    );
  }).join("");

  const status = s.phase === "setup"
    ? person.ready ? "✓" : "…"
    : turn ? " · Am Zug" : "";

  return `
    <section
      class="player ${mine ? "mine" : ""} ${turn ? "active" : ""}"
      data-player="${index}">
      <div class="player-head">
        <strong>
          ${escapeText(person.name)}${mine ? " · Du" : ""}
        </strong>
        <span>${person.total} P. ${status}</span>
      </div>
      <div class="hand-row">${cards}</div>
    </section>
  `;
}

function button(label, action, style = "", disabled = false) {
  return `<button type="button" class="${style}" data-action="${action}"
    ${disabled || locked() ? "disabled" : ""}>${label}</button>`;
}

function rules() {
  return `
    <details>
      <summary>Spielregeln & Bedienung</summary>
      <p>Merke dir am Anfang deine beiden äußeren Karten.
      Ziel sind möglichst wenige Punkte. Ziehe eine Karte und
      ersetze damit eine deiner vier Karten oder lege sie ab.
      Eine Zahlenkarte vom Ablagestapel musst du einbauen.</p>
      <p><b>Spähen:</b> eine eigene Karte ansehen.
      <b>Tausch:</b> eine eigene Karte verdeckt mit einer fremden tauschen.
      <b>Zweimal:</b> die erste Karte verwenden oder eine zweite ziehen,
      die du verwenden musst. Aktionskarten werden verwendet oder,
      wenn erlaubt, abgelegt – nicht eingebaut.</p>
      <p>Nach deiner Aktion kannst du klopfen. Alle anderen haben
      dann noch einen Zug. Bei der Wertung werden Aktionskarten in
      der Auslage durch Zahlenkarten ersetzt.
      Ihr spielt so viele Runden, wie Personen mitspielen.
      Die wenigsten Gesamtpunkte gewinnen.</p>
      <p>Rechts neben den vier Karten liegt die gerade gezogene Karte.
      Fremde gezogene Karten bleiben für dich verdeckt.
      Den Ton kannst du oben rechts ausschalten.</p>
      <p>Bei Verbindungsproblemen denselben Tab neu laden.
      Ein Server-Neustart beendet laufende Lobbys.</p>
    </details>
  `;
}

function welcome() {
  app.innerHTML = `
    <section class="glass welcome">
      <div class="badge">Ein kleiner Spieleabend</div>
      <h1>Wer hat die<br>kleinsten Karten?</h1>
      <p>Erstelle einen Tisch oder setz dich mit einem Lobbycode
      zu deinen Freunden.</p>

      <label for="name">Dein Name</label>
      <input id="name" maxlength="20" autocomplete="nickname"
        placeholder="Zum Beispiel Kevin">
      <button id="create">Tisch erstellen</button>

      <div class="divider"></div>

      <label for="code">Lobbycode</label>
      <input id="code" maxlength="6" autocomplete="off"
        placeholder="ABC234"
        style="text-transform:uppercase;letter-spacing:4px">
      <button class="secondary" id="join">Mitspielen</button>

      <p class="note">Lass diesen Tab offen, um deinen Platz zu behalten.</p>
    </section>
  `;

  document.getElementById("code").value =
    new URLSearchParams(location.search).get("raum") || "";

  document.getElementById("create").onclick = () => enter("create");
  document.getElementById("join").onclick = () => enter("join");
}

async function enter(kind) {
  if (busy) return;

  const name = document.getElementById("name").value.trim();
  const code = document.getElementById("code").value;

  if (!name) {
    notify("Gib bitte deinen Namen ein.");
    return;
  }

  busy = true;
  app.querySelectorAll("button").forEach(b => b.disabled = true);
  unlockAudio();

  try {
    const result = await post(kind, {name, code});
    credentials = {code:result.state.code, token:result.token};
    remember();
    resetView(result.state);
  } catch (error) {
    notify(error.message);
  } finally {
    busy = false;
    if (state) render();
    else app.querySelectorAll("button").forEach(b => b.disabled = false);
  }
}

/* Oberfläche */
function render() {
  const s = state;
  if (!s) return;

  if (s.phase === "lobby") {
    app.innerHTML = `
      <section class="glass lobby">
        <div class="badge">Euer Lobbycode</div>
        <div class="code">${s.code}</div>
        <div class="row">
          ${button("Einladung kopieren","invite","secondary")}
        </div>
        <p>Teile den Code oder den Link. Der Gastgeber startet,
        sobald alle da sind.</p>
        ${s.players.map((p,i) => `
          <div class="member">
            <strong>${escapeText(p.name)}</strong>
            <span>${i === 0 ? "Gastgeber" : p.online ? "Bereit" : "Verbindung prüfen"}</span>
          </div>
        `).join("")}
        <div style="margin-top:20px">
          ${s.me === 0
            ? button("Spiel starten","start","",s.players.length < 2)
            : "<p>Warte auf den Gastgeber …</p>"}
        </div>
      </section>
      ${rules()}
    `;
    bind();
    return;
  }

  const mine = s.turn === s.me;
  const me = s.players[s.me];
  const over = ["result","finished"].includes(s.phase);

  let title = "";
  let instruction = "";
  let controls = "";
  let result = "";

  if (s.phase === "setup") {
    title = "Karten merken";
    instruction = me.ready
      ? "Warte, bis alle ihre Karten verdeckt haben."
      : "Merke dir deine beiden äußeren Karten unten.";

    if (!me.ready) {
      controls = button("Gemerkt – verdecken","ready");
    }
  } else if (over) {
    title = s.phase === "finished" ? "Partie beendet" : "Runde beendet";

    const ranked = [...s.players].sort((a,b) => a.total - b.total);
    const winners = ranked
      .filter(p => p.total === ranked[0].total)
      .map(p => p.name).join(" & ");

    instruction = s.phase === "finished"
      ? "Gewonnen: " + winners : "Die Punkte sind gezählt.";

    result = `
      <section class="glass result">
        ${ranked.map(p => `
          <div class="result-row">
            <strong>${escapeText(p.name)}</strong>
            <span>Runde: ${p.score} · Gesamt: <b>${p.total}</b></span>
          </div>
        `).join("")}
      </section>
    `;

    controls = s.me === 0
      ? button(s.phase === "finished" ? "Neue Partie" : "Nächste Runde","next")
      : "<p>Der Gastgeber startet die nächste Runde.</p>";
  } else {
    title = mine ? "Du bist am Zug" : s.players[s.turn].name + " ist am Zug";

    if (!mine) {
      instruction = "Beobachte die Kartenbewegungen.";
    } else if (s.step === "draw") {
      instruction = "Ziehe verdeckt oder nimm die offene Zahlenkarte.";
      controls = button("Karte ziehen","draw") +
        button("Ablage nehmen","take","secondary",typeof s.top !== "number");
    } else if (s.step === "held") {
      instruction = typeof s.held === "number"
        ? "Tippe auf eine deiner vier Karten, um sie zu ersetzen."
        : "Verwende deine gezogene Aktionskarte.";

      if (typeof s.held !== "number") {
        controls += button("Aktion verwenden","use");
      }
      if (["", "first", "second"].includes(s.mode)) {
  controls += button(
    s.mode === "first" ? "Keine verwenden – Zug abschließen" : "Ablegen",
    "discard",
    "secondary"
  );
}
      }
      if (s.mode === "first") {
        controls += button("Zweite Karte ziehen","second","secondary");
        instruction += " Oder ziehe die zweite Karte.";
      }
      if (s.mode === "forced") {
        instruction += " Diese Karte musst du verwenden.";
      }
    } else if (s.step === "peek") {
      instruction = "Tippe auf eine deiner Karten zum Spähen.";
    } else if (s.step === "reveal") {
      instruction = "Merke dir die aufgedeckte Karte.";
      controls = button("Wieder verdecken","close");
    } else if (s.step === "swap") {
      instruction = selection === null
        ? "Wähle zuerst eine deiner Karten."
        : "Wähle jetzt eine Karte eines Mitspielers.";
    } else if (s.step === "end") {
      instruction = "Beende deinen Zug oder klopfe.";
      controls = button("Zug beenden","end");
      if (s.knocker === null) {
        controls += button("Klopfen ✊","knock","gold");
      }
    }
  }

  const finalInfo = s.phase === "play" && s.knocker !== null
    ? " · Letzte Züge: " + s.remaining : "";

  app.innerHTML = `
    <section class="glass status">
      <div>
        <strong>${escapeText(title)}</strong>
        <span>Runde ${s.round} / ${s.players.length}${finalInfo}</span>
      </div>
      <span>${s.code}</span>
    </section>

    <div class="opponents">
      ${s.players.map((p,i) => i === s.me ? "" : playerHTML(p,i)).join("")}
    </div>

    ${result}

    <section class="table">
      <div class="table-middle">
   <div class="piles">
  <div class="pile">
    ${card(
      null,
      "deck",
      mine && s.phase === "play" && s.step === "draw"
    )}
    <p>Nachziehen</p>
  </div>

  <div class="pile drawn-pile">
    ${
      s.phase === "play" && s.step === "held"
        ? card(mine ? s.held : null, "held:" + s.turn)
        : `<div class="ghost" data-zone="held:${s.turn}">
             <span>↓</span>
           </div>`
    }
    <p>
      <strong>Gezogene Karte</strong><br>
      ${
        s.phase === "play"
          ? escapeText(s.players[s.turn].name)
          : "Gemeinsamer Ziehplatz"
      }
    </p>
  </div>

  <div class="pile">
    ${card(
      s.top,
      "discard",
      mine && s.phase === "play" &&
      s.step === "draw" && typeof s.top === "number"
    )}
    <p>Ablage</p>
  </div>
</div>
        <div class="action-area">
          <div class="eventline">${escapeText(caption)}</div>
          <div class="instruction">${escapeText(instruction)}</div>
          <div class="row controls">${controls}</div>
        </div>
      </div>
      <p class="note">${escapeText(s.message)}</p>
    </section>

    ${playerHTML(me,s.me)}
    ${rules()}
  `;

  bind();
}

function bind() {
  app.querySelectorAll("[data-action]").forEach(element => {
    element.onclick = () => {
      if (locked()) return;

      if (element.dataset.action === "invite") {
        const link = location.origin + "/?raum=" + state.code;

        if (navigator.clipboard) {
          navigator.clipboard.writeText(link)
            .then(() => notify("Einladungslink kopiert!"))
            .catch(() => notify("Lobbycode: " + state.code));
        } else notify("Lobbycode: " + state.code);
      } else send(element.dataset.action);
    };
  });

  app.querySelectorAll(".card:not(:disabled)").forEach(element => {
    element.onclick = () => {
      if (locked()) return;
      const zone = element.dataset.zone;

      if (zone === "deck") return send("draw");
      if (zone === "discard") return send("take");
      if (!zone || !zone.startsWith("hand:")) return;

      const [,ownerText,indexText] = zone.split(":");
      const owner = Number(ownerText);
      const index = Number(indexText);

      if (state.step === "swap") {
        if (owner === state.me) {
          selection = index;
          render();
        } else if (selection !== null) {
          send("swap", {
            index:selection,
            other:owner,
            otherIndex:index
          });
        }
      } else {
        send(state.step === "peek" ? "peek" : "replace", {index});
      }
    };
  });
}

/* Animationen */
function zoneElement(zone) {
  return app.querySelector(`[data-zone="${zone}"]`);
}

async function animateElement(element, frames, duration, delay = 0) {
  if (!element || !element.animate || reducedMotion.matches) return;

  const animation = element.animate(frames, {
    duration,
    delay,
    easing:"cubic-bezier(.22,.7,.25,1)",
    fill:"forwards"
  });

  animations.add(animation);
  try { await animation.finished; } catch {}
  animations.delete(animation);
}

function cancelAnimations() {
  animations.forEach(animation => animation.cancel());
  animations.clear();
  document.querySelectorAll(".flight").forEach(element => element.remove());
}

async function fly(move, duration, generation, delay = 0) {
  const from = zoneElement(move.from);
  const to = zoneElement(move.to);

  if (!from || !to || generation !== epoch) return;

  const start = from.getBoundingClientRect();
  const end = to.getBoundingClientRect();

  if (!start.width || !end.width) return;

  const element = document.createElement("div");
  element.className = "flight";

  const value =
    move.from === "deck" && move.to.startsWith("held:")
      ? null
      : move.card;

  element.innerHTML = card(value);

  Object.assign(element.style, {
    left: start.left + "px",
    top: start.top + "px",
    width: start.width + "px",
    height: start.height + "px"
  });

  document.body.appendChild(element);

  try {
    const middleWidth = Math.max(start.width, end.width, 110);
    const middleHeight = Math.max(start.height, end.height, 165);

    const middleX =
      (start.left + start.width / 2 +
       end.left + end.width / 2) / 2;

    const middleY =
      (start.top + start.height / 2 +
       end.top + end.height / 2) / 2;

    await animateElement(element, [
      {
        left: start.left + "px",
        top: start.top + "px",
        width: start.width + "px",
        height: start.height + "px",
        transform: "rotate(-3deg)"
      },
      {
        left: middleX - middleWidth / 2 + "px",
        top: middleY - middleHeight / 2 - 55 + "px",
        width: middleWidth + "px",
        height: middleHeight + "px",
        transform: "rotate(6deg)"
      },
      {
        left: end.left + "px",
        top: end.top + "px",
        width: end.width + "px",
        height: end.height + "px",
        transform: "rotate(0deg)"
      }
    ], duration, delay);

    if (generation !== epoch) return;

    if (move.to.startsWith("hand:") && value !== null) {
      await animateElement(
        element.firstElementChild,
        [
          {transform: "rotateY(0deg)"},
          {transform: "rotateY(90deg)"}
        ],
        220
      );
    }

    if (generation !== epoch) return;

    // Die Karte bleibt am Ziel sichtbar, auch wenn danach
    // noch eine weitere Bewegung derselben Aktion folgt.
    const landedValue = move.to.startsWith("hand:")
      ? null
      : move.card;

    const holder = document.createElement("div");
    holder.innerHTML = card(landedValue, move.to);

    const currentTarget = zoneElement(move.to);
    if (currentTarget) {
      currentTarget.replaceWith(holder.firstElementChild);
    }

    element.remove();

    if (!reducedMotion.matches) {
      await new Promise(resolve => setTimeout(resolve, 240));
    }
  } finally {
    element.remove();
  }
}

function eventText(event) {
  const name = event.state.players[event.actor]?.name || "";
  const text = {
    join:"ist dazugekommen.",
    deal:"teilt die Karten aus.",
    draw:"zieht eine Karte.",
    take:"nimmt die offene Karte.",
    replace:"ersetzt eine Karte.",
    discard:"legt eine Karte ab.",
    second:"zieht die zweite Karte.",
    use:"verwendet eine Aktionskarte.",
    swap:"tauscht zwei Karten.",
    peek:"schaut eine eigene Karte an.",
    close:"verdeckt die Karte wieder.",
    ready:"hat sich die Karten gemerkt.",
    end:"beendet den Zug.",
    knock:"klopft! Alle anderen haben noch einen Zug.",
    score:"– die Runde wird ausgewertet."
  };
  return name + " " + (text[event.type] || "");
}

function changedHands(before, after) {
  const zones = [];
  if (!before) return zones;

  after.players.forEach((p,i) => p.hand.forEach((value,j) => {
    if (before.players[i]?.hand[j] !== value) {
      zones.push(`hand:${i}:${j}`);
    }
  }));

  return zones;
}

async function showEvent(event, generation) {
  const duration = queue.length > 10 ? 1000 : 1450;
  const before = state;

  caption = eventText(event);
  const line = app.querySelector(".eventline");
  if (line) line.textContent = caption;

  if (queue.length < 8) playSound(event.type);

  if (event.type === "deal") {
    // Erst leere Kartenplätze zeichnen, anschließend austeilen.
    state = {
      ...event.state,
      top:null,
      players:event.state.players.map(p => ({
        ...p,
        hand:p.hand.map(() => null)
      }))
    };
    render();
  }

  if (event.moves.length) {
    for (const move of event.moves) {
      for (const zone of [move.from, move.to]) {
        if (zone.startsWith("hand:") || zone.startsWith("held:")) {
          const element = zoneElement(zone);
          if (element) element.style.visibility = "hidden";
        }
      }

      if (move.from === "discard") {
        const element = zoneElement("discard");
        if (element) element.style.visibility = "hidden";
      }
    }

    if (event.type === "swap" || event.type === "deal") {
      await Promise.all(event.moves.map((move,i) => {
        const delay = event.type === "deal"
          ? Math.min(i * 25, 450) : 0;
        return fly(move,duration,generation,delay);
      }));
    } else {
      for (const move of event.moves) {
        await fly(move,duration,generation);
        if (generation !== epoch) return;
      }
    }
  }

  if (generation !== epoch) return;

  const flipTypes = ["peek","close","ready","score"];
  const flips = flipTypes.includes(event.type)
    ? changedHands(before,event.state) : [];

  if (flips.length) {
    await Promise.all(flips.map(zone =>
      animateElement(zoneElement(zone), [
        {transform:"rotateY(0deg)"},
        {transform:"rotateY(90deg)"}
      ], duration * .4)
    ));
  } else if (event.type === "peek") {
    // Bei Mitspielern bleibt die Karte verdeckt.
    await animateElement(zoneElement(`hand:${event.actor}:${event.index}`), [
      {transform:"translateY(0) rotate(0deg)"},
      {transform:"translateY(-8px) rotate(-5deg)"},
      {transform:"translateY(0) rotate(0deg)"}
    ], duration);
  }

  if (generation !== epoch) return;

  state = event.state;
  selection = null;
  render();

  const opening = [...flips];

  if (event.type === "deal") {
    state.players[state.me].hand.forEach((value,j) => {
      if (value !== null) opening.push(`hand:${state.me}:${j}`);
    });
  }

  if (
    ["draw","take","second","use"].includes(event.type) &&
    state.me === event.actor && state.step === "held"
  ) {
    opening.push(`held:${state.me}`);
  }

  await Promise.all(opening.map(zone =>
    animateElement(zoneElement(zone), [
      {transform:"rotateY(-90deg)"},
      {transform:"rotateY(0deg)"}
    ], duration * .4)
  ));

  if (event.type === "knock" && generation === epoch) {
    notify(caption);
    await animateElement(app.querySelector(".table"), [
      {transform:"translateY(0)"},
      {transform:"translateY(5px)"},
      {transform:"translateY(0)"},
      {transform:"translateY(4px)"},
      {transform:"translateY(0)"}
    ], 450);
  }
}

/* Ereignisse sammeln und genau einmal der Reihe nach abspielen. */
function resetView(nextState) {
  epoch++;
  cancelAnimations();
  queue = [];
  processing = false;
  state = nextState;
  received = nextState.version;
  selection = null;
  caption = "";
  render();
}

function ingest(data) {
  const next = data.state;

  if (!credentials || !next || next.code !== credentials.code) return;

  if (!state || data.resync) {
    if (state && next.version < received) return;
    resetView(next);
    return;
  }

  const fresh = (data.events || [])
    .filter(event => event.version > received)
    .sort((a,b) => a.version - b.version);

  for (const event of fresh) {
    if (event.version <= received) continue;

    if (event.version !== received + 1) {
      resetView(next);
      return;
    }

    queue.push(event);
    received = event.version;
  }

  if (next.version > received) {
    resetView(next);
    return;
  }

  if (!processing && !queue.length && next.version === state.version) {
    const presenceChanged = next.players.some(
      (p,i) => p.online !== state.players[i]?.online
    );

    state = next;

    if (presenceChanged && state.phase === "lobby") render();
  }

  drain();
}

async function drain() {
  if (processing || !queue.length) return;

  processing = true;
  const generation = epoch;
  app.querySelectorAll("button").forEach(b => b.disabled = true);

  try {
    while (queue.length && generation === epoch) {
      const event = queue.shift();

      try {
        await showEvent(event,generation);
      } catch {
        if (generation === epoch) {
          cancelAnimations();
          state = event.state;
          render();
        }
      }
    }
  } finally {
    if (generation === epoch) {
      processing = false;
      render();
    }
  }
}

async function send(action, extra = {}) {
  if (locked() || !credentials || !state) return;

  busy = true;
  const session = credentials;
  app.querySelectorAll("button").forEach(b => b.disabled = true);
  unlockAudio();

  try {
    const result = await post("action", {
      ...session,
      version:state.version,
      since:received,
      request:crypto.randomUUID(),
      action,
      ...extra
    });

    if (credentials === session) ingest(result);
  } catch (error) {
    notify(error.message);
  } finally {
    busy = false;
    if (state && !processing) render();
  }
}

async function poll() {
  if (credentials && !polling && !busy) {
    polling = true;
    const session = credentials;

    try {
      const result = await post("state", {
        ...session,
        ...(state ? {since:received} : {})
      });

      if (credentials === session) {
        ingest(result);
        connection.textContent = "Lobby " + session.code + " · Verbunden";
      }
    } catch (error) {
      if (credentials === session) {
        if (error.status === 401 || error.status === 404) {
          epoch++;
          cancelAnimations();
          queue = [];
          processing = false;
          credentials = null;
          state = null;
          received = 0;
          remember();
          connection.textContent = "2–6 Personen";
          welcome();
          notify(error.message);
        } else {
          connection.textContent = "Verbindung wird wiederhergestellt …";
        }
      }
    } finally {
      polling = false;
    }
  }

  setTimeout(poll,650);
}

if (credentials) {
  app.innerHTML = `
    <section class="glass welcome">
      <h1>Zurück an den Tisch …</h1>
      <p>Dein Spielstand wird geladen.</p>
    </section>
  `;
} else {
  welcome();
}

poll();
</script>
</body>
</html>
